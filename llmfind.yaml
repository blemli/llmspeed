# scenarios: which artificial analysis index counts as accuracy, the in:out token mix that blends the price, one example prompt
scenarios:
  coding:
    index: coding_index
    tokens: [3000, 1500]
    example: "Write a python function that parses ISO-8601 durations like P3DT4H30M into seconds. Add doctests."
  classifier:
    index: intelligence_index
    tokens: [600, 5]
    example: "Classify this support ticket as billing, bug, feature or other. Reply with one word only.\n\nTicket: Since yesterday's update the export button does nothing."
  chat:
    index: intelligence_index
    tokens: [800, 400]
    example: "Explain in three sentences why the sky is blue, then give me one surprising fact about it."

# open weights are priced by writing off a graphics card, not by what a provider charges. fixed street prices, usd, nov 2026.
writeoff_years: 3       # straight-line
utilization: 0.5        # fraction of the day the box actually has work
kwh_usd: 0.20           # electricity
overhead: 1.3           # server, cooling, rack, admin on top of the card
mfu_decode: 0.20        # fraction of peak bf16 flops reached while generating (batched decode, moe)
mfu_prefill: 0.60       # fraction reached while reading the prompt
bytes_per_param: 1.2    # fp8 weights + kv cache headroom
max_cards: 8            # one box
gpus:
  - name: RTX 5090
    price: 2000
    vram_gb: 32
    tflops: 210
    watts: 575
  - name: H100
    price: 30000
    vram_gb: 80
    tflops: 989
    watts: 700
  - name: B200
    price: 40000
    vram_gb: 180
    tflops: 2250
    watts: 1000
